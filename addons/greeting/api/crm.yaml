#
# Served at /v1/ext/acme-greeting/hello: paths here are relative to /v1.
overlay: 1.0.0
info:
  title: acme-greeting
  version: "0.1.0"
actions:
  - target: $.paths['/ext/acme-greeting/hello']
    update:
      get:
        operationId: acmeGreetingHello
        summary: Return this installation's greeting.
        tags: [Extensions]
        x-mcp-tool:
          verb: acme_greeting_hello
          version: 1.0.0
          title: Acme greeting
          tier: auto_execute
          scope: read
          description: >-
            Return the greeting this installation's own extension serves. It
            reads and changes nothing.
        responses:
          '200':
            description: The greeting.
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: false
                  required: [message]
                  properties:
                    message: { type: string }
          '401': { $ref: '#/components/responses/Unauthorized' }
          '403': { $ref: '#/components/responses/Forbidden' }
